<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Ve</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">Type or speak a command</div>
    </div>

    <form class="input-bar" id="inputForm">
      <button type="button" class="mic-button" id="micButton" title="Voice input (coming in Phase 4)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
      </button>
      <input
        type="text"
        id="textInput"
        class="text-input"
        placeholder="Ask Ve to do something…"
        autocomplete="off"
        autofocus
      />
      <button type="submit" class="send-button" id="sendButton" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
        </svg>
      </button>
    </form>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
